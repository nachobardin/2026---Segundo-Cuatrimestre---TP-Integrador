<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Autoservicio NBA</title>
    <link rel="stylesheet" href="estilos.css">
    <script src="/tienda/tema.js" defer></script>
</head>
<body>

    <header>
        <h1>Autoservicio NBA</h1>
        <p>Camisetas y zapatillas de basquet</p>

        <button id="cambiar-tema" type="button" aria-pressed="false">
            Activar modo oscuro
        </button>
    </header>

    <main>
        <section id="bienvenida">
            <h2>¡Bienvenido a la cancha!</h2>
            <p>Ingresá tu nombre para elegir tu equipamiento.</p>

            <form id="form-bienvenida">
                <label for="nombre-cliente">Tu nombre</label>
                <input id="nombre-cliente" type="text" maxlength="80" required>
                <button type="submit">Comenzar</button>
            </form>

            <p id="aviso-bienvenida" role="status"></p>
        </section>
    </main>

    <script src="bienvenida.js"></script>
    
</body>
</html>
