<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Autoservicio NBA</title>
</head>
<body>

    <header>
        <h1>Autoservicio NBA</h1>
        <p>Camisetas y zapatillas de basquet</p>
    </header>

    <main>
        <h2>Catalogo</h2>

        <!--Aca vamos a mostrar los productos que nos devuelva nuestra API-->
        <ul id="lista-productos"></ul>

        <nav aria-label="Paginas del catalogo">
            <button id="pagina-anterior" type="button" disabled>Anterior</button>
            <span id="estado-pagina" aria-live="polite"></span>
            <button id="pagina-siguiente" type="button" disabled>Siguiente</button>

        </nav>

        <section aria-labelledby="titulo-carrito">
            <h2 id="titulo-carrito">Carrito</h2>
            <p id="carrito-vacio">Todavia no agregaste productos al carrito</p>
            <ul id="lista-carrito"></ul>
            <p>Total: $<strong id="total-carrito">0.00</strong></p>


            <form id="form-revisar-pedido">
                <label for="nombre-cliente">Tu nombre</label>
                <input id="nombre-cliente" type="text" maxlength="80" required>
                <button type="submit">Revisar pedido</button>
            </form>
            <p id="aviso-pedido" role="status"></p>


        </section>

        <dialog id="resumen-pedido" aria-labelledby="titulo-resumen">
            <h2 id="titulo-resumen">Resumen del pedido</h2>
            <p id="cliente-resumen"></p>
            <ul id="productos-resumen"></ul>
            <p>Total: $<strong id="total-resumen"></strong></p>

            <button id="confirmar-compra" type="button">Confirmar compra</button>
            <p id="aviso-compra" role="status"></p>

            <form method="dialog">
                <button type="submit">Volver al carrito</button>
            </form>

    
        </dialog>


        
    </main>

    <script src="catalogo.js"></script>
    
</body>
</html>
